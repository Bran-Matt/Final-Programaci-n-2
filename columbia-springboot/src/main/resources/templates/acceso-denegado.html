<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Aviso')}"></head>
<body>
<th:block th:if="${usuarioActual != null}"><nav th:replace="~{fragments/layout :: navbar}"></nav></th:block>
<main class="container">
    <div class="cv-card cv-vacio mt-5 mx-auto" style="max-width: 520px">
        <i class="bi bi-shield-exclamation text-warning"></i>
        <h4 class="text-dark">Ups</h4>
        <p th:text="${mensaje != null} ? ${mensaje} : 'No tenés permiso para entrar a esta sección.'">No tenés permiso.</p>
        <a th:href="@{/}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i>Volver al inicio</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
