<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Columbia Viajes'">Columbia Viajes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- Barra de navegación: muestra solo las secciones que el usuario tiene permitidas -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark cv-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="cv-logo"><i class="bi bi-globe-americas"></i></span> Columbia Viajes
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto ms-lg-4 gap-lg-1">
                <li class="nav-item" th:if="${usuarioActual.puedeGestionarReservas()}">
                    <a class="nav-link" th:classappend="${rutaActual == '/panel'} ? active" th:href="@{/panel}"><i class="bi bi-grid me-1"></i>Panel</a>
                </li>
                <li class="nav-item" th:if="${usuarioActual.puedeVerMisReservas()}">
                    <a class="nav-link" th:classappend="${rutaActual.startsWith('/cliente')} ? active" th:href="@{/cliente/mis-reservas}"><i class="bi bi-suitcase2 me-1"></i>Mis viajes</a>
                </li>
                <li class="nav-item" th:if="${usuarioActual.puedeGestionarReservas()}">
                    <a class="nav-link" th:classappend="${rutaActual.startsWith('/gestion/reservas')} ? active" th:href="@{/gestion/reservas}"><i class="bi bi-ticket-perforated me-1"></i>Reservas</a>
                </li>
                <li class="nav-item" th:if="${usuarioActual.puedeGestionarReservas()}">
                    <a class="nav-link" th:classappend="${rutaActual.startsWith('/gestion/clientes')} ? active" th:href="@{/gestion/clientes}"><i class="bi bi-people me-1"></i>Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${rutaActual.contains('vuelos')} ? active" th:href="@{/vuelos}"><i class="bi bi-airplane me-1"></i>Vuelos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${rutaActual.contains('hoteles')} ? active" th:href="@{/hoteles}"><i class="bi bi-building me-1"></i>Hoteles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${rutaActual.contains('sucursales')} ? active" th:href="@{/sucursales}"><i class="bi bi-shop me-1"></i>Sucursales</a>
                </li>
                <li class="nav-item" th:if="${usuarioActual.puedeAdministrar()}">
                    <a class="nav-link" th:classappend="${rutaActual.startsWith('/admin/usuarios')} ? active" th:href="@{/admin/usuarios}"><i class="bi bi-person-gear me-1"></i>Usuarios</a>
                </li>
                <li class="nav-item" th:if="${usuarioActual.puedeVerRanking()}">
                    <a class="nav-link" th:classappend="${rutaActual.startsWith('/duenio')} ? active" th:href="@{/duenio/ranking}"><i class="bi bi-trophy me-1"></i>Ranking</a>
                </li>
            </ul>
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center gap-2 text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                    <span class="cv-avatar" th:text="${usuarioActual.iniciales}">JP</span>
                    <span class="d-none d-xl-inline lh-sm">
                        <span class="d-block fw-semibold" th:text="${usuarioActual.nombreCompleto}">Juan Pérez</span>
                        <small class="opacity-75" th:text="${usuarioActual.rol.etiqueta}">Cliente</small>
                    </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                    <li><span class="dropdown-item-text small text-suave">Ingresaste como <b th:text="${usuarioActual.codigo}"></b></span></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- Mensajes de éxito / error -->
<div th:fragment="mensajes">
    <div th:if="${exito}" class="alert alert-success border-0 shadow-sm d-flex align-items-center gap-2 alert-dismissible fade show">
        <i class="bi bi-check-circle-fill"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger border-0 shadow-sm d-flex align-items-center gap-2 alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="cv-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span><i class="bi bi-globe-americas me-1"></i>Columbia Viajes · Programación II</span>
        <span>Spring Boot · Thymeleaf · Hibernate · Bootstrap</span>
    </div>
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</footer>

</body>
</html>
