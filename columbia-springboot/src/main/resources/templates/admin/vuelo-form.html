<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 820px">
    <div class="cv-encabezado">
        <div class="d-flex align-items-center gap-3">
            <span class="cv-icono azul"><i class="bi bi-airplane"></i></span>
            <div><h1 th:text="${titulo}">Vuelo</h1><p>Vuelo regular contratado en exclusiva por la cadena.</p></div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <form class="cv-card p-4" th:action="@{/admin/vuelos/guardar}" th:object="${entidad}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="alert alert-danger border-0" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" for="numero">Número de vuelo</label>
                <input class="form-control" type="text" th:field="*{numero}" th:errorclass="is-invalid" maxlength="10" placeholder="CV505">
                <div class="invalid-feedback" th:errors="*{numero}"></div>
            </div>
            <div class="col-md-8">
                <label class="form-label" for="fechaHora">Fecha y hora</label>
                <input class="form-control" type="datetime-local" th:field="*{fechaHora}" th:errorclass="is-invalid" >
                <div class="invalid-feedback" th:errors="*{fechaHora}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="origen">Origen</label>
                <input class="form-control" type="text" th:field="*{origen}" th:errorclass="is-invalid" >
                <div class="invalid-feedback" th:errors="*{origen}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="destino">Destino</label>
                <input class="form-control" type="text" th:field="*{destino}" th:errorclass="is-invalid" >
                <div class="invalid-feedback" th:errors="*{destino}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="plazasTotales">Plazas totales</label>
                <input class="form-control" type="number" th:field="*{plazasTotales}" th:errorclass="is-invalid" min="1">
                <div class="invalid-feedback" th:errors="*{plazasTotales}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="plazasTurista">Plazas de clase turista</label>
                <input class="form-control" type="number" th:field="*{plazasTurista}" th:errorclass="is-invalid" min="0">
                <div class="invalid-feedback" th:errors="*{plazasTurista}"></div>
            </div>
            <div class="col-12"><small class="text-suave"><i class="bi bi-info-circle me-1"></i>Las plazas de primera clase son las totales menos las de turista.</small>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('plazasValidas')}" th:errors="*{plazasValidas}"></div></div>
            <div class="col-md-6">
                <label class="form-label" for="precioTurista">Precio clase turista ($)</label>
                <input class="form-control" type="number" th:field="*{precioTurista}" th:errorclass="is-invalid" min="0" step="0.01">
                <div class="invalid-feedback" th:errors="*{precioTurista}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="precioPrimera">Precio primera clase ($)</label>
                <input class="form-control" type="number" th:field="*{precioPrimera}" th:errorclass="is-invalid" min="0" step="0.01">
                <div class="invalid-feedback" th:errors="*{precioPrimera}"></div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a th:href="@{/vuelos}" class="btn btn-light">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
