<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 820px">
    <div class="cv-encabezado">
        <div class="d-flex align-items-center gap-3">
            <span class="cv-icono azul"><i class="bi bi-building"></i></span>
            <div><h1 th:text="${titulo}">Hotel</h1><p>Hotel contratado en exclusiva por la cadena.</p></div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <form class="cv-card p-4" th:action="@{/admin/hoteles/guardar}" th:object="${entidad}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="alert alert-danger border-0" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" for="codigo">Código</label>
                <input class="form-control" type="text" th:field="*{codigo}" th:errorclass="is-invalid" maxlength="10" placeholder="H006">
                <div class="invalid-feedback" th:errors="*{codigo}"></div>
            </div>
            <div class="col-md-8">
                <label class="form-label" for="nombre">Nombre</label>
                <input class="form-control" type="text" th:field="*{nombre}" th:errorclass="is-invalid" >
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
            </div>
            <div class="col-md-8">
                <label class="form-label" for="direccion">Dirección</label>
                <input class="form-control" type="text" th:field="*{direccion}" th:errorclass="is-invalid" >
                <div class="invalid-feedback" th:errors="*{direccion}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="ciudad">Ciudad</label>
                <input class="form-control" type="text" th:field="*{ciudad}" th:errorclass="is-invalid" >
                <div class="invalid-feedback" th:errors="*{ciudad}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="telefono">Teléfono</label>
                <input class="form-control" type="text" th:field="*{telefono}" th:errorclass="is-invalid" >
                <div class="invalid-feedback" th:errors="*{telefono}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="plazasDisponibles">Plazas disponibles</label>
                <input class="form-control" type="number" th:field="*{plazasDisponibles}" th:errorclass="is-invalid" min="1">
                <div class="invalid-feedback" th:errors="*{plazasDisponibles}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="precioNoche">Precio por noche ($)</label>
                <input class="form-control" type="number" th:field="*{precioNoche}" th:errorclass="is-invalid" min="0" step="0.01">
                <div class="invalid-feedback" th:errors="*{precioNoche}"></div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a th:href="@{/hoteles}" class="btn btn-light">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
