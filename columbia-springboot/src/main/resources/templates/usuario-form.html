<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 820px">
    <div class="cv-encabezado">
        <div class="d-flex align-items-center gap-3">
            <span class="cv-icono azul"><i class="bi bi-person-vcard"></i></span>
            <div><h1 th:text="${titulo}">Usuario</h1><p>Datos personales y de acceso.</p></div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <form class="cv-card p-4" th:action="@{${accion}}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <!-- Rol: elegible solo al crear desde la administración de usuarios -->
        <div class="mb-4" th:if="${rolEditable}">
            <label class="form-label">Rol</label>
            <div th:if="*{id == null}" class="row g-2">
                <div class="col-6 col-md-3" th:each="r : ${roles}">
                    <input type="radio" class="btn-check" th:field="*{rol}" th:value="${r}" th:id="'rol-' + ${r}" onchange="mostrarSucursal()">
                    <label class="cv-opcion text-center" th:for="'rol-' + ${r}">
                        <i class="bi fs-4 d-block mb-1" th:classappend="${r.icono}"></i><span class="fw-semibold" th:text="${r.etiqueta}"></span>
                    </label>
                </div>
            </div>
            <div th:unless="*{id == null}">
                <input type="hidden" th:field="*{rol}">
                <span class="badge badge-suave fs-6" th:text="*{rol.etiqueta}"></span>
            </div>
        </div>
        <input th:unless="${rolEditable}" type="hidden" th:field="*{rol}">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="nombre">Nombre</label>
                <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="apellidos">Apellidos</label>
                <input class="form-control" th:field="*{apellidos}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{apellidos}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="codigo">Código de usuario <small class="text-suave fw-normal" th:if="${!rolEditable}">(código de turista)</small></label>
                <input class="form-control" th:field="*{codigo}" th:errorclass="is-invalid" maxlength="20">
                <div class="invalid-feedback" th:errors="*{codigo}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="clave">Clave</label>
                <input class="form-control" type="password" th:field="*{clave}" th:errorclass="is-invalid"
                       th:placeholder="*{id == null} ? 'Clave para ingresar' : 'Dejala vacía para no cambiarla'">
                <div class="invalid-feedback" th:errors="*{clave}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="direccion">Dirección</label>
                <input class="form-control" th:field="*{direccion}">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="telefono">Teléfono</label>
                <input class="form-control" th:field="*{telefono}">
            </div>
            <div class="col-md-6" id="campo-sucursal">
                <label class="form-label" for="sucursalId">Sucursal</label>
                <select class="form-select" th:field="*{sucursalId}">
                    <option value="">Sin sucursal</option>
                    <option th:each="s : ${sucursales}" th:value="${s.id}" th:text="${s.codigo} + ' · ' + ${s.direccion}"></option>
                </select>
                <small class="text-suave">Para un cliente, la sucursal que contrató.</small>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a th:href="@{${volver}}" class="btn btn-light">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    // La sucursal solo aplica a clientes y vendedores
    function mostrarSucursal() {
        var marcado = document.querySelector('input[name="rol"]:checked') || document.querySelector('input[name="rol"]');
        var rol = marcado ? marcado.value : 'CLIENTE';
        document.getElementById('campo-sucursal').style.display =
            (rol === 'CLIENTE' || rol === 'VENDEDOR') ? '' : 'none';
    }
    mostrarSucursal();
</script>
</body>
</html>
