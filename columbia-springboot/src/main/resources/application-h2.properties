# H2 guarda la base en el archivo ./data/columbia.mv.db (se crea solo).
# Para empezar de cero, cerrá la app y borrá la carpeta "data".
spring.datasource.url=jdbc:h2:file:./data/columbia;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Consola de H2 para ver la base desde el navegador: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/columbia;AUTO_SERVER=TRUE, usuario sa, clave vacía).
# web-allow-others=false: solo se puede entrar desde esta misma computadora.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
