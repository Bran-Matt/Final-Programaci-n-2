spring.application.name=columbia-viajes

# Base de datos: "h2" (por defecto, no hay que instalar nada) o "mysql".
# Para usar MySQL: cambiá la línea de abajo por spring.profiles.active=mysql
spring.profiles.active=h2

# Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

server.port=8080
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie
